<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>لمسة</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"><style id="css">

:root{--bg:#f3f3f3;--sf:#fff;--ink:#0a0a0a;--mut:#6b6b6b;--ln:#d9d9d9;--ph:#e6e6e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.7 "IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.w{max-width:1120px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:4px}
.hd>.ib{justify-self:start}
.hr{display:flex;justify-content:flex-end}
.logo{font:700 34px/1.2 "Aref Ruqaa","Amiri",serif;text-decoration:none}
.ib{border:0;background:none;padding:8px;display:inline-flex;align-items:center;gap:4px;font-weight:600}
#cn{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:10px}
.sr{padding:0 18px 10px}
.sr input{width:100%;border:0;border-bottom:1px solid var(--ink);background:none;padding:6px 2px}
.note{background:var(--ink);color:var(--bg);text-align:center;font-size:12px;padding:4px 12px}
h2{margin:28px 0 12px;font-size:13px;font-weight:700;line-height:1.3}
.stage{height:280px;perspective:1000px;display:grid;place-items:center;overflow:hidden;touch-action:pan-y;cursor:grab}
.ring{position:relative;width:150px;height:200px;transform-style:preserve-3d}
.ct{position:absolute;inset:0;display:flex;flex-direction:column;border:0;padding:0;background:var(--ph);transform:rotateY(var(--a)) translateZ(var(--z));backface-visibility:hidden;box-shadow:0 16px 22px -16px rgba(0,0,0,.55)}
.ct span{flex:1;display:grid;place-items:center;font:700 64px/1 "Aref Ruqaa","Amiri",serif}
.ct img{flex:1;min-height:0;width:100%;display:block;object-fit:cover}
.ct b{background:var(--ink);color:var(--bg);font-size:12px;padding:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px;padding-block:22px 8px}
.it{padding:8px 8px 12px;text-align:center;perspective:800px;font-weight:600;color:var(--ink);background:rgba(217,217,217,.58);border:1px solid #fff;border-radius:17px;box-shadow:12px 17px 51px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:all .5s}
.it:hover{border-color:var(--ink);transform:scale(1.05);z-index:2}
.it:active{transform:scale(.95) rotateZ(1.7deg)}
.it .add{border-radius:9px}
.it .op button{border-radius:6px}
.ph{position:relative;border-radius:8px;aspect-ratio:3/4;display:grid;place-items:center;background:var(--ph);font:700 80px/1 "Aref Ruqaa","Amiri",serif;transform-style:preserve-3d;transition:transform .12s ease-out,box-shadow .2s}
.ph span{transform:translateZ(34px)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ph em{position:absolute;inset:auto 0 0;border-radius:0 0 8px 8px;background:var(--ink);color:var(--bg);font:500 12px/1.2 "IBM Plex Sans Arabic",sans-serif;padding:6px}
.it h3{margin:10px 0 2px;font-size:13px;font-weight:700;line-height:1.5}
.pr{display:flex;justify-content:center;gap:8px;align-items:baseline;font-size:13px}
.pr s{color:var(--mut);font-size:12px}
.pr.s b{font-weight:700}
.op{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:8px}
.op button{min-width:32px;border:1px solid var(--ink);background:none;padding:0 8px;font-size:12px}
.op .on{background:var(--ink);color:var(--bg)}
.add{display:block;width:100%;margin-top:10px;border:1px solid var(--ink);background:none;padding:7px;font-weight:600;font-size:13px;text-align:center;text-decoration:none}
.add:hover{background:var(--ink);color:var(--bg)}
.pri{background:var(--ink);color:var(--bg)}
.pri:hover{background:none;color:var(--ink)}
.mt{color:var(--mut);text-align:center;padding:30px 0;grid-column:1/-1}
.qt{display:inline-flex;align-items:center;border:1px solid var(--ink)}
.qt button{width:32px;height:30px;border:0;background:none;font-size:18px}
#ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#dr,#mn{position:fixed;top:0;bottom:0;z-index:21;width:min(380px,100%);display:flex;flex-direction:column;background:var(--bg);visibility:hidden;transition:transform .25s,visibility .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
#dr{left:0;transform:translateX(-100%);padding-top:env(safe-area-inset-top,0px)}
#mn{right:0;width:min(300px,86%);transform:translateX(100%)}
.open #ov,.menu #ov{opacity:1;pointer-events:auto}
.open #dr,.menu #mn{transform:none;visibility:visible}
.mh{background:var(--ink);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.mh button{width:28px;height:28px;border:1px solid var(--bg);background:none;color:var(--bg);line-height:1}
.mi{display:block;width:100%;border:0;border-bottom:1px solid var(--ln);background:none;padding:12px 18px;text-align:start;font-weight:600}
.mi.on{background:var(--ink);color:var(--bg)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ln)}
#ln{flex:1;overflow-y:auto;padding:4px 18px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
#co{display:grid;gap:8px;padding:14px 18px 18px;border-top:1px solid var(--ln)}
.tt{display:flex;justify-content:space-between;font-size:16px}
#co input{width:100%;padding:8px 10px;border:1px solid var(--ln);background:var(--sf)}
#msg{margin:0;color:#b3261e;font-size:13px}
small{color:var(--mut)}
#ts{position:fixed;inset:auto 0 calc(96px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;z-index:30;background:var(--ink);color:var(--bg);padding:8px 16px;font-size:13px}
.ck #root>:not(#ckv){display:none!important}
#ckv{--ck:#1a5fd0;background:#fff;min-height:100vh}
.cw{display:grid;grid-template-columns:1fr}
.cl{background:#fff}
.cr{background:#f5f5f5;border-bottom:1px solid #e1e1e1;order:-1}
.cm,.cs{padding:20px 18px 36px}
.cm{display:grid;gap:10px;max-width:600px}
.cs{display:grid;gap:14px;align-content:start;max-width:460px}
@media(min-width:900px){.cw{grid-template-columns:1.2fr 1fr}.cr{order:0;border-bottom:0;border-inline-start:1px solid #e1e1e1;min-height:100vh}.cm{margin-inline-start:auto;padding-top:36px}.cs{padding-top:48px}}
.cm .logo{font-size:44px;justify-self:start}
.cm h3{margin:16px 0 0;font-size:17px;font-weight:700}
.cm input,.cm select{width:100%;padding:12px;border:1px solid #d3d3d3;border-radius:5px;background:#fff;font-size:14px}
.cm input:focus,.cm select:focus,.dc input:focus{outline:2px solid var(--ck);outline-offset:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input,.opt input{width:auto}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #d3d3d3;border-radius:5px;padding:13px 14px;background:#fff}
.opt:has(input){justify-content:flex-start}
.opt.on,.opt:has(input:checked){border-color:var(--ck);background:#f0f5ff}
.er{margin:0;color:#b3261e;font-size:13px}
.cb{display:block;padding:16px;border:0;border-radius:5px;background:var(--ck);color:#fff;font-weight:700;font-size:15px;text-align:center;text-decoration:none}
.cb:hover{filter:brightness(.9)}
.sl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.sq{position:relative;width:56px;height:56px;border:1px solid #ddd;border-radius:6px;background:var(--ph);display:grid;place-items:center;font:700 24px "Aref Ruqaa",serif}
.sq i{font-style:normal}
.sq img{width:100%;height:100%;object-fit:cover;border-radius:5px}
.bd{position:absolute;top:-8px;inset-inline-end:-8px;min-width:20px;height:20px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font:500 12px/20px "IBM Plex Sans Arabic",sans-serif;text-align:center}
.dc{display:flex;gap:8px}
.dc input{flex:1;min-width:0;padding:12px;border:1px solid #d3d3d3;border-radius:5px;background:#fff}
.ap{padding:0 18px;border:0;border-radius:5px;background:#e3e3e3;font-weight:600}
.tl{display:flex;justify-content:space-between;margin-top:6px}
.tl.g{font-size:20px}
.dn{display:grid;gap:12px;justify-items:center;max-width:420px;margin:0 auto;padding:40px 18px;text-align:center}
.dn .cb,.dn .add{width:100%}
#ph{scroll-margin-top:64px}
.gm{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;width:calc(100% - 20px);max-width:520px;display:flex;gap:6px;padding:8px;overflow-x:auto;scrollbar-width:none;border-radius:99rem;background:rgba(10,10,10,.58);border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.18),inset 2px 2px 5px -2px rgba(255,255,255,.4),inset -2px -2px 5px 2px rgba(255,255,255,.18),inset 0 -2px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px) saturate(180%) contrast(120%);backdrop-filter:blur(12px) saturate(180%) contrast(120%)}
.gm::-webkit-scrollbar{display:none}
.gm button{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:rgba(255,255,255,.9);padding:10px 6px;border-radius:99rem;-webkit-tap-highlight-color:transparent;transition:background .18s cubic-bezier(.34,1.56,.64,1),color .18s,transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.gm button:hover{background:rgba(255,255,255,.22);box-shadow:inset 2px 2px 5px -2px rgba(255,255,255,.4),inset -2px -1px 5px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(255,255,255,.2)}
.gm button.on{background:rgba(237,237,237,.9);color:var(--ink)}
.gm button:active{transform:scale(.97)}
.gm svg{width:1.4rem;height:1.4rem;flex:none}
.gm span{font-size:.8rem;font-weight:600;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbw{--cb:#7a7a7a;position:relative;direction:ltr;width:200px;height:60px;margin:8px auto 0}
.pbw .btn{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;padding:0;background:linear-gradient(to bottom,#000 10%,#1f1f1f 50%,#3d3d3d 100%);border:2px solid var(--ink);border-radius:7px;overflow:hidden;user-select:none;transition:.5s}
.pbw .btn:hover{transform:scale(1.1)}
.pbw .stars{position:absolute;width:2px;height:2px;background:#fff;z-index:3;border-radius:50%;transform:translate(-20px,-20px);box-shadow:5px 10px #fff,10px -2px #fff,20px 0 #fff,30px -5px #fff,-10px -5px #fff,-15px 2px #fff,-35px 0 #fff,50px 15px #fff,60px -10px #fff,70px 20px #fff,90px -15px #fff,100px 5px #fff,90px 30px #fff,-50px 20px #fff,-70px -10px #fff,-90px 25px #fff,-100px -15px #fff,-80px 40px #fff,40px 40px #fff,30px -40px #fff,-30px 30px #fff,-40px -25px #fff,45px 5px #fff,65px 0 #fff,-60px 10px #fff,-45px -8px #fff}
.pbw .background{position:absolute;width:50%;height:160%;background:#fff;border-radius:50%;transform:translate(-100%,50%) scale(1);box-shadow:-30px -40px 0 -7px #ffffffd8,40px 14px rgba(255,255,255,.507);animation:pbs 1s forwards paused}
.pbw .background::before{content:"";position:absolute;width:80%;height:80%;background:#fff;border-radius:50%;transform:translate(110%,20%);box-shadow:50px -5px #ffffffb2}
.pbw .background::after{content:"";position:absolute;width:120%;height:120%;background:#fff;border-radius:50%;transform:translate(120%,10%);box-shadow:50px -20px #ffffffd8}
.pbw .order{color:#fff;font-weight:700;font-size:1.04rem;animation:pbt 4s forwards paused}
.pbw .done{position:absolute;color:var(--ink);font-weight:700;font-size:1.04rem;transform:translate(-700%);animation:pbt2 4s forwards paused}
.pbw .car-container{position:absolute;height:60%;width:20%;display:flex;justify-content:center;align-items:center;transform:translate(-310%,8%);animation:pbc 4s ease forwards paused}
.pbw .car-part1{position:absolute;width:60%;height:20%;background:var(--cb);bottom:30%;left:10%}
.pbw .car-part1::before{position:absolute;content:"";width:75%;height:220%;background:#e6e6e6;left:20%;bottom:100%;clip-path:polygon(0% 100%,10% 0%,80% 0%,100% 100%)}
.pbw .car-part1::after{position:absolute;content:"";width:50%;height:100%;background:var(--cb);left:0;bottom:100%;clip-path:polygon(0% 100%,0% 0%,50% 0%,100% 100%)}
.pbw .wheels{position:absolute;width:28%;height:35%;background:#000;border-radius:50%;left:5%;bottom:15%}
.pbw .wheels::before{content:"";position:absolute;width:80%;height:70%;background:#000;border-radius:50%;left:180%;bottom:0}
.pbw .car-part2{position:absolute;width:7%;height:70%;background:#000;left:68%;bottom:25%}
.pbw .car-part2::before{content:"";position:absolute;width:155%;height:50%;background:#000;left:0;bottom:0}
.pbw .car-part2::after{content:"";position:absolute;width:555%;height:6%;background:#000;left:0;bottom:0}
.pbw .details{position:absolute;width:30%;height:3%;background:var(--cb);top:5%;left:25%}
.pbw .details::before{content:"";position:absolute;width:50%;height:650%;border-radius:50%;background:var(--cb);top:1750%;left:-45%}
.pbw .details::after{content:"";position:absolute;width:30%;height:400%;border-radius:50%;background:var(--cb);top:2060%;left:125%}
.pbw .package-container{position:absolute;width:25%;height:80%;display:flex;justify-content:center;align-items:center;transform:translate(0,100%);animation:pbp 4s forwards paused}
.pbw .package{position:absolute;width:45%;height:40%;background:#bdbdbd}
.pbw .package::after{content:"";position:absolute;width:50%;height:5%;background:#8f8f8f;right:0;top:-2%;transform:rotate(210deg);transform-origin:right;animation:pbk .5s ease-in-out .3s forwards paused}
.pbw .package::before{content:"";position:absolute;width:50%;height:5%;background:#8f8f8f;left:0;top:-2%;transform:rotate(-210deg);transform-origin:left;animation:pbk2 .5s ease-in-out .3s forwards paused}
.pbw .package-details{position:absolute;background:#0a0a0a;width:10%;height:10%;top:30%}
.pbw .package-details::before{content:"";position:absolute;background:#ededed;width:100%;height:100%;bottom:-280%;left:-150%}
.pbw .package-details::after{content:"";position:absolute;background:#8f8f8f;width:40%;height:40%;bottom:-230%;left:-105%}
.pbw .package-text{position:absolute;z-index:2;bottom:32%;right:30%;font-size:.3rem;font-weight:700;color:#0a0a0a}
.pbw.go .background,.pbw.go .order,.pbw.go .done,.pbw.go .car-container,.pbw.go .package-container,.pbw.go .package::before,.pbw.go .package::after{animation-play-state:running}
.pbw.go .stars{display:none}
@keyframes pbs{to{transform:translate(-100%,50%) scale(5)}}
@keyframes pbp{0%{transform:translate(0,100%)}10%,50%{transform:translate(0,0)}100%{transform:translate(325%,0)}}
@keyframes pbt{0%{transform:none}10%,100%{transform:translate(0,-200%)}}
@keyframes pbt2{0%,50%{transform:translate(-700%)}100%{transform:none}}
@keyframes pbc{0%,10%{transform:translate(-310%,8%)}45%,50%{transform:translate(-60%,8%)}100%{transform:translate(350%,8%)}}
@keyframes pbk{to{transform:rotate(0)}}
@keyframes pbk2{to{transform:rotate(0)}}
.li>div:first-child{flex:1;min-width:0}
.dw{width:40px;height:40px;flex:none;transition:width .3s}
.dw:hover{width:110px}
.dl{position:relative;width:100%;height:40px;padding:0;border:0;border-radius:50px;background:var(--ink);font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,0,0,.164);cursor:pointer;transition:background .3s;overflow:hidden}
.dl .svgIcon{width:10px;transition-duration:.3s}
.dl .svgIcon path{fill:#fff}
.dw:hover .dl{background:#c62828}
.dw:hover .svgIcon{width:40px;transform:translateY(60%)}
.dl::before{position:absolute;top:-16px;content:attr(data-t);color:#fff;transition-duration:.3s;font-size:2px}
.dw:hover .dl::before{font-size:12px;opacity:1;transform:translateY(24px)}
.pg{display:flex;justify-content:center;padding:6px 18px 120px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;isolation:isolate;padding-bottom:20px}
.tab-group{position:relative}
.tab-group input{appearance:none;-webkit-appearance:none;position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.tab-group input:focus-visible+label{outline:2px solid var(--ink);outline-offset:4px}
.tab-group label{display:flex;align-items:center;justify-content:center;width:48px;height:48px;line-height:1.6;border:1px solid var(--ln);border-radius:12px;cursor:pointer;font-weight:700;position:relative;isolation:isolate;background:transparent;transition:all .48s cubic-bezier(.23,1,.32,1)}
.tab-group label::after{content:"";position:absolute;bottom:-32px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--ink);transform:translateX(-50%);transform-origin:0 0;scale:0;opacity:0;z-index:-1;transition:all .48s .2s cubic-bezier(.23,1,.32,1)}
.tab-group label::before{content:"";position:absolute;top:-24px;left:50%;width:48px;height:48px;border-radius:12px;background:var(--ink);transform:translate(-50%,-50%);z-index:-1;opacity:0;scale:0;transform-origin:0 0;transition:all .48s cubic-bezier(.23,1,.32,1)}
.tab-group label:hover{border-color:var(--ink);color:var(--ink)}
.tab-group input:checked+label{border-color:transparent;color:#fff;scale:1.1}
.tab-group input:checked+label::after{bottom:-16px;opacity:1;scale:1;box-shadow:0 6px 13px rgba(0,0,0,.1),0 24px 24px rgba(0,0,0,.09),0 55px 33px rgba(0,0,0,.05),0 97px 39px rgba(0,0,0,.01)}
.tab-group input:checked+label::before{opacity:1;scale:1;top:50%;box-shadow:0 6px 13px rgba(0,0,0,.1),0 24px 24px rgba(0,0,0,.09),0 55px 33px rgba(0,0,0,.05),0 97px 39px rgba(0,0,0,.01)}
.ab{position:relative;direction:ltr;display:flex;align-items:center;justify-content:center;width:100%;height:40px;margin-top:10px;padding:0;border:2px solid var(--ink);border-radius:10px;background:var(--sf);box-shadow:4px 4px var(--ink);overflow:hidden;cursor:pointer;transition:background .3s,border-color .3s,box-shadow .3s,transform .15s}
.ab__t{color:var(--ink);font-weight:600;font-size:13px;transition:transform .3s}
.ab__i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--sf);transform:translateY(100%);transition:transform .3s,background .3s}
.ab .svg{width:20px;height:20px;stroke:var(--ink);transition:stroke .3s}
.ab .svg.c{display:none}
.ab:active{transform:translate(3px,3px);box-shadow:0 0 var(--ink)}
.ab:active .ab__t,.ab.ok .ab__t{transform:translateY(-100%)}
.ab:active .ab__i,.ab.ok .ab__i{transform:none}
@media(hover:hover){.ab:hover .ab__t{transform:translateY(-100%)}.ab:hover .ab__i{transform:none}}
.ab.ok{border-color:#178a4a;box-shadow:4px 4px #178a4a}
.ab.ok .svg{stroke:#178a4a}
.ab.ok .svg.p{display:none}
.ab.ok .svg.c{display:block}
#cd{display:grid;gap:10px}
.cc{position:relative;width:300px;max-width:100%;aspect-ratio:1.586;perspective:1000px;color:#fff;direction:ltr;justify-self:center;margin:4px 0 8px}
.cc p{margin:0}
.cc-in{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
.cc.fl .cc-in{transform:rotateY(180deg)}
.cc-f,.cc-k{position:absolute;inset:0;border-radius:16px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:var(--cb,#171717);background-image:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 55%);box-shadow:rgba(0,0,0,.4) 0 2px 2px,rgba(0,0,0,.3) 0 7px 13px -3px,rgba(0,0,0,.2) 0 -1px 0 inset;transition:background-color .5s}
.cc-k{transform:rotateY(180deg)}

const PAY_URL="";
const BR={visa:{n:"VISA",re:/^4/,len:[16]},mc:{n:"MASTERCARD",re:/^(5[1-5]|222[1-9]|22[3-9]\d|2[3-6]\d\d|27[01]\d|2720)/,len:[16]},meeza:{n:"MEEZA",re:/^5078/,len:[16]},amex:{n:"AMEX",re:/^3[47]/,len:[15]}};
const LG={mc:`<svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><path fill="#ff9800" d="M32 10A14 14 0 1 0 32 38A14 14 0 1 0 32 10Z"/><path fill="#d50000" d="M16 10A14 14 0 1 0 16 38A14 14 0 1 0 16 10Z"/><path fill="#ff3d00" d="M18,24c0,4.755,2.376,8.95,6,11.48c3.624-2.53,6-6.725,6-11.48s-2.376-8.95-6-11.48C20.376,15.05,18,19.245,18,24z"/></svg>`,visa:`<b class="vz">VISA</b>`,meeza:`<b class="mz">ميزة</b>`,amex:`<b class="ax">AMEX</b>`};
const brand=d=>Object.keys(BR).find(k=>BR[k].re.test(d))||"";
const kfmt=(d,b)=>b=="amex"?[d.slice(0,4),d.slice(4,10),d.slice(10)].filter(Boolean).join(" "):d.replace(/(\d{4})(?=\d)/g,"$1 ");
const mask=(d,b)=>{let i=0;return(b=="amex"?"•••• •••••• •••••":"•••• •••• •••• ••••").replace(/•/g,()=>d[i++]||"•")};
const luhn=d=>{let s=0,a=0;for(let i=d.length-1;i>=0;i--){let n=+d[i];if(a){n*=2;if(n>9)n-=9}s+=n;a^=1}return s%10==0};
const kdig=()=>$("#kn").value.replace(/\D/g,"");
const kinfo=()=>{const d=kdig(),b=brand(d);return{brand:b,last4:d.slice(-4),label:(b?BR[b].n:"CARD")+" ••"+d.slice(-4)}};
function kup(id){
 const n=$("#kn"),b=brand(kdig()),d=kdig().slice(0,b=="amex"?15:16),e=$("#ke"),c=$("#kc"),ev=e.value.replace(/\D/g,"").slice(0,4);
 if(id=="kn")n.value=kfmt(d,b);
 if(id=="ke")e.value=ev.length>2?ev.slice(0,2)+"/"+ev.slice(2):ev;
 if(id=="kc"||id=="kn")c.value=c.value.replace(/\D/g,"").slice(0,b=="amex"?4:3);
 $("#cc").dataset.b=b;$("#ccb").textContent=b?BR[b].n:"CARD";$("#ccl").innerHTML=LG[b]||"";
 $("#ccn").textContent=mask(d,b);$("#ccm").textContent=($("#km").value.trim()||"FULL NAME").toUpperCase();
 $("#ccd").textContent=e.value||"MM/YY";$("#ccc").textContent=c.value||"•••";
}
function kchk(){
 const d=kdig(),b=brand(d),p=$("#ke").value.split("/"),M=+p[0],Y=2000+ +p[1],now=new Date();
 if(!luhn(d)||(b?!BR[b].len.includes(d.length):d.length<13))return "رقم البطاقة غير صحيح.";

 if(!(M>=1&&M<=12)||!(p[1]&&p[1].length==2)||Y<now.getFullYear()||(Y==now.getFullYear()&&M<now.getMonth()+1))return "تاريخ انتهاء البطاقة غير صحيح.";
 if($("#kc").value.length!=(b=="amex"?4:3))return "رمز الأمان (CVV) غير صحيح.";
 return "";
}
function kpay(){
 const p=$("#ke").value.split("/");

}
